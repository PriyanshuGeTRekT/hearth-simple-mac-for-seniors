name: Feature request
description: Suggest an idea or an improvement for Hearth.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the existing issues and the [roadmap](https://github.com/PriyanshuGeTRekT/hearth-simple-mac-for-seniors#roadmap) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I often want to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you use today

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home screen and buttons
        - Reminders
        - Help and scam warnings
        - Floating Home/Help bar
        - Caregiver settings and setup files
        - Strict mode
        - Something new
    validations:
      required: true
